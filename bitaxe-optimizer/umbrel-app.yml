manifestVersion: 1
id: bitaxe-optimizer
category: bitcoin
name: Bitaxe Optimizer
version: "0.3.0"
tagline: Adaptive, error-aware Bitaxe optimization
description: >-
  Adaptive Bitaxe optimizer using coupled frequency/voltage control, ASIC temperature
  and fan feedback, measured J/TH, hardware error rate and rejected shares. At minimum
  F/V with excess temperature it hands cooling to AxeOS Auto Fan and resumes optimization
  only after fan speed falls below the configured target.
developer: rhenry86
website: https://github.com/rhenry86/bitaxe-optimizer
repo: https://github.com/rhenry86/bitaxe-optimizer
support: https://github.com/rhenry86/bitaxe-optimizer/issues
releaseNotes: Initial GitHub-ready release with coupled F/V control and AxeOS Auto Fan fallback.
dependencies: []
